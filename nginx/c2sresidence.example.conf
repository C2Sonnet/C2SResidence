# Deployment sample only; verify paths and TLS before use.
server {
    listen 80;
    server_name resi.c2s.me;
    root /var/www/c2sresidence/public;
    index index.html;
    autoindex off;
    location / { try_files $uri $uri/ =404; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:ini|log|sql|db|sqlite|zip|bak)$ { deny all; }
}
